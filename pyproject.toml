[project]
name = "cafetomo"
version = "1.0.0.dev0"
description = "Two-position muon tomography of the TAU cafeteria ceiling: full analysis and paper."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Hadar Cohen", email = "hal.nls@gmail.com" }]
dependencies = ["numpy", "scipy", "PyYAML", "uproot", "matplotlib"]

[project.scripts]
cafetomo = "cafetomo.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-playwright", "playwright", "ruff", "vulture"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cafetomo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the real-data chain (minutes)", "browser: needs Playwright Chromium"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "paper/figures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.vulture]
paths = ["src/cafetomo", "paper/figures"]
min_confidence = 80
