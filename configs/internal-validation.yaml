mode: pilot
# Retrospective internal validation; no independent surveyed ceiling truth.
root_seed: 314159
seed_streams: [stage, fold, replica]  # separate NumPy SeedSequence streams
count:
  train_fraction: 0.5
  outer_seeds: 3
  inner_train_fraction: 0.5
  roof_scope: training_split
angular:
  folds: 5
  tile: 5
  guard: 1
  assignment: "(tile_x + 2 * tile_y) % folds"
  roof_scope: full_reference_conditional
  live_time_scope: full_acquisition
selection:
  scope: inner_partition
  tv_alpha: [0.015, 0.03, 0.06]
  coverage_damping: [0, 0.05, 0.1]
  vertical_tv_weight: 0
features:
  signal_to_error: [2, 3, 4]
  background_degree: [1, 2]
recovery:
  noiseless_cases: 2
  noise_replicas_per_case: 5

# Frozen before outcomes; representative-fold counting uncertainty only.
prediction_uncertainty:
  replicas: 2
  scope: first_outer_fold_per_protocol
stability:
  count_replicas: 5
  algorithm_target_sweeps:
    tv_alpha: [0.015, 0.03, 0.06]
    coverage_damping: [0, 0.05, 0.1]
  contrast_threshold: 0.01
  choices:
    - {group: algorithm, contrast_threshold: 0.01, overrides: {}}
    - {group: algorithm, contrast_threshold: 0.01, overrides: {volume: {spacing_m: 0.15}}}
    - {group: algorithm, contrast_threshold: 0.01, overrides: {volume: {spacing_m: 0.25}}}
    - {group: algorithm, contrast_threshold: 0.01, lattice_shift: 0.5}
    - {group: display, contrast_threshold: 0.005}
    - {group: display, contrast_threshold: 0.02}
    - {group: support, background_degree: 1, support_threshold: 2, tangent_sigma: 0}
    - {group: support, background_degree: 1, support_threshold: 3, tangent_sigma: 0}
    - {group: support, background_degree: 1, support_threshold: 4, tangent_sigma: 0}
    - {group: support, background_degree: 2, support_threshold: 2, tangent_sigma: 0}
    - {group: support, background_degree: 2, support_threshold: 3, tangent_sigma: 0}
    - {group: support, background_degree: 2, support_threshold: 4, tangent_sigma: 0}
    - {group: weights, contrast_threshold: 0.01, weight_method: analytic}
    - group: weights
      contrast_threshold: 0.01
      weight_method: poisson
      n_sigma_replicas: 256
      convergence_evidence:
        metric: p95_relative_sigma_change
        maximum: 0.10
        comparison: same-seed n versus 2n on common positive rows
