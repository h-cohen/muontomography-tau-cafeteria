# TAU cafeteria campaign: two detector positions under the ceiling and one
# open-sky roof run of the same detector.
site: cafeteria
data_dir: ../data

# Measured from the sky run: active width = span of `Hit Position cm Layer0..3`
# above 1% of plateau (all four layers, 23 live bars); layer separation =
# width / acceptance-edge |tan| (0.91 at 0.2% of peak in `txty`).
detector:
  active_width_cm: 35.375
  layer_dz_cm: 38.9
  source: "HistsOutSkyRoofRuns37-77.root hit positions and txty acceptance edge"

sky_reference:
  id: SKY
  root_file: HistsOutSkyRoofRuns37-77.root

exposures:
  - id: pos0
    root_file: HistsOutDataCafePos0.root
    pose: {x: 0.0, y: 0.0, z: 0.0, az_deg: 0.0}
  - id: pos1
    root_file: HistsOutDataCafePos1.root
    # Prior only: a ~1.75 m floor offset along +x. The separation from pos0 is
    # measured (selfcal.baseline_m); the bearing and azimuth are fitted by
    # `cafetomo selfcal` into results/pose.json, which is the pose used downstream.
    pose: {x: 1.75, y: 0.0, z: 0.0, az_deg: 0.0}

binning:          # the ROOT bins (0.005 tan), cropped to +-1.25
  t_max: 1.25
  n_bins: 500

opacity:
  rebin_factor: 10        # 0.05 tan analysis bins
  max_tan: 1.25
  min_sky: 25.0           # sky counts below which a bin is not used
  t_floor: 0.05           # transmission floor; caps lambda at ~3.0
  sky_t_max: 2.5
  sky_n_bins: 100
  n_sigma_replicas: 12    # Poisson replicas for the per-bin lambda sigma (fit weights)

volume:
  z_min_m: 1.0
  z_max_m: 9.0
  spacing_m: 0.2
  n_aperture_sub: 4
  # Display-only clip box: the region both positions see. Cropping the SOLVE
  # box instead dumps oblique rays' opacity on its side walls.
  viewer_crop_xy_m: [[-5.0, 7.0], [-5.0, 5.0]]

reconstruction:
  algorithm: tv
  n_iter: 150
  # Swept 0.01-0.2 on the data: 0.03 is where chi2 ~ 1 under the bootstrap
  # weights, the least smoothing that stops fitting noise; 0.08+ smears beams.
  tv_alpha: 0.03
  # z smoothing fights the only depth information (parallax of sharp features).
  tv_z_weight: 0.0
  # Damps voxels crossed by one or two rays (the noise shell); 0.2+ over-damps.
  coverage_damping: 0.05

selfcal:
  free_pose: pos1
  baseline_m: 2.42        # tape-measured pos0-pos1 floor separation; sets the absolute scale
  # With the separation fixed the bearing search is +-bounds_m/baseline_m rad
  # (2.6/2.42 = +-61.5 deg), wide enough to reach the ~42 deg the free fit implies.
  bounds_m: 2.6
  bounds_deg: 10.0
  spacing_m: 0.4          # coarse lattice for the pose objective
  n_iter: 60
  n_bootstrap: 8

autofocus:
  z_min_m: 6.0
  z_max_m: 8.0
  coarse_m: 0.2
  fine_m: 0.1
  layer_thickness_m: 0.3
  spacing_m: 0.1          # 0.15 m aliases the ~1.7 m beam pitch at 7 m
  trim_pct: 90.0          # drop each view's worst 10% of bins (aliasing spikes)

beams:
  band_x: 0.32            # |tan_y| band averaged for profiles across x
  band_y: 0.45
  match_tol_m: 0.6
  prominence_sigmas: 0.5
  gate_max_offset_m: 0.15
  z_scan_m: [4.0, 9.0]
  n_z: 81
  min_y_corr: 0.5         # y features join the triangulation only if the y parallax agrees

beamdepth:
  y_extent_m: [-5.0, 5.0]   # beams run along y across the room
  band_sy: 0.32
  w_init_m: 0.3
  h_init_m: 0.6
  h_max_m: 3.0
  bg_degree: 2
  n_sub: 4
  y_band_m: [-2.0, 2.0]     # voxel z-profile cross-check: y range averaged

uncertainty:
  n_replicas: 50
  seed: 0
  flux_scale_frac: 0.03     # sky-run vs position-run flux difference (pressure, epoch)
  mcs_p_min_gev: 0.5        # conservative lower muon momentum cut for MCS (overburden unknown; higher only lowers it)

validation:
  focus_heights_m: [6.6, 7.0, 7.4]
  depth_h_true_m: [0.6, 1.25, 2.0]
  n_realizations: 8

# Pins the beams' opacity density to concrete (see src/cafetomo/muonphysics.py
# for the spectra and the PDG range table).
physics:
  concrete_density_gcm3: 2.4    # steel-reinforced concrete, nominal
  concrete_density_sigma: 0.1   # its systematic
  # ESTIMATE, not measured: kinetic energy to cross the four scintillator
  # planes and their housing, taken as ~6 g/cm^2 (CSDA range of a 30 MeV muon).
  detector_threshold_gev: 0.03
  # Guan et al. 2015 (arXiv:1509.06176): Gaisser's PDG formula corrected to
  # sub-GeV energies. PDG eq. (30.4) itself is valid only above 100/cos GeV.
  flux_model: guan
  flux_model_alt: shukla        # Shukla & Sankrith 2018 (arXiv:1606.06907)
