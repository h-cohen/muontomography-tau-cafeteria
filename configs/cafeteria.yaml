# TAU cafeteria campaign: two detector positions under the ceiling and one
# open-sky roof run of the same detector.
site: cafeteria
data_dir: ../data

# Measured from the sky run: active width = span of `Hit Position cm Layer0..3`
# above 1% of plateau (all four layers, 23 live bars); layer separation =
# width / acceptance-edge |tan| (0.91 at 0.2% of peak in `txty`).
detector:
  active_width_cm: 35.375
  layer_dz_cm: 38.9
  source: "HistsOutSkyRoofRuns37-77.root hit positions and txty acceptance edge"

sky_reference:
  id: SKY
  root_file: HistsOutSkyRoofRuns37-77.root

exposures:
  - id: pos0
    root_file: HistsOutDataCafePos0.root
    pose: {x: 0.0, y: 0.0, z: 0.0, az_deg: 0.0}
  - id: pos1
    root_file: HistsOutDataCafePos1.root
    # Prior only: a ~1.75 m floor offset along +x. The separation from pos0 is
    # estimated (selfcal.baseline_m); the bearing and azimuth are fitted by
    # `cafetomo selfcal` into results/pose.json, which is the pose used downstream.
    pose: {x: 1.75, y: 0.0, z: 0.0, az_deg: 0.0}

# Event-level DAQ cluster dumps (`.data`), an alternative source of an exposure's counts
# (`cafetomo ingest-raw`); the baseline reads the pre-binned ROOT histograms above.
raw:
  exposures:
    pos0: ../../../01_data/processed/tau_cafeteria_raw_filtered/pos0
    pos1: ../../../01_data/processed/tau_cafeteria_raw_filtered/pos1
    SKY: ../../../01_data/processed/tau_cafeteria_raw_filtered/roof
  # Per ASIC, the DAQ channel read by bar 0..22 (engineers' lookup). Validated on the
  # pos0 data: 97% of two-bar clusters are adjacent bars, 0.1% of rows touch an unmapped
  # channel; the identity map would give 0.2% adjacency.
  channel_bars:
    - [28, 30, 3, 31, 29, 0, 24, 26, 7, 27, 25, 4, 20, 22, 11, 23, 21, 8, 16, 18, 15, 19, 17]
    - [3, 31, 2, 0, 28, 1, 7, 27, 6, 4, 24, 5, 11, 23, 10, 8, 20, 9, 15, 19, 14, 12, 16]
    - [19, 15, 18, 16, 12, 17, 23, 11, 22, 20, 8, 21, 27, 7, 26, 24, 4, 25, 31, 3, 30, 28, 0]
    - [12, 14, 19, 15, 13, 16, 8, 10, 23, 11, 9, 20, 4, 6, 27, 7, 5, 24, 0, 2, 31, 3, 1]
  # ASIC pairs (lower, upper) behind the ROOT axes: tx is ASICs 0 -> 1, ty is ASICs 3 -> 2,
  # each (upper - lower) / gap. Gaps and pairing are those whose tangent combs coincide
  # bin for bin with the ROOT txty marginals (chi2 per bin ~2 at the minimum, >100 at
  # +-0.2 cm). The gaps differ from the 38.9 cm acceptance-edge value of `detector`.
  tx_asics: [0, 1]
  ty_asics: [3, 2]
  gap_cm: [37.0, 36.8]
  bar_pitch_cm: 1.6     # bar centre b at 1.6 (b + 1); matches the ROOT hit-position peaks
  pedestal_hg: [2207, 2210, 2232, 2224]   # median high-gain charge of channels with no hit flag
  # The hit flag is no charge threshold: a layer with one flagged bar also takes a
  # neighbour 3 pedestal widths above its channel's own (Gaussian) pedestal.
  neighbour_sigmas: 3.0
  # Each cluster charge is divided by its channel's Landau x Gauss MPV relative to the
  # median of its ASIC, from the exposure's own calibration (1 where not calibrated).
  gain_correction: true
  # The run clock reads 50x too long: a daily file spans 4.32e6 clock-seconds, and 50x
  # fewer gives 86 404 s per file and the ROOT track rate (7.2 Hz).
  clock_divisor: 50.0
  # The roof file holds runs 37-77 back to back, one per span between run-clock resets,
  # except run 37, whose clock reset once after its first 1.2 h (42 spans for 41 runs).
  # From run 58 the detector was turned by 90 deg about the vertical to gauge
  # the azimuthal asymmetry of its response; the detector-frame mean tan(theta_y) changes
  # sign there and nowhere else. The turn was clockwise from above (operator record).
  first_run:
    SKY: 37
  restarts:
    SKY: [37]
  subsets:
    SKY_A: {exposure: SKY, runs: [37, 57], turn_deg: 0.0}
    SKY_B: {exposure: SKY, runs: [58, 77], turn_deg: -90.0}

binning:          # the ROOT bins (0.005 tan), cropped to +-1.25
  t_max: 1.25
  n_bins: 500

opacity:
  rebin_factor: 10        # 0.05 tan analysis bins
  max_tan: 1.25
  min_sky: 25.0           # sky counts below which a bin is not used
  t_floor: 0.05           # transmission floor; caps lambda at ~3.0
  sky_t_max: 2.5
  sky_n_bins: 100
  n_sigma_replicas: 12    # Poisson replicas for the per-bin lambda sigma (fit weights)

volume:
  z_min_m: 1.0
  z_max_m: 9.0
  spacing_m: 0.2
  n_aperture_sub: 4
  # Display-only clip box: the region both positions see. Cropping the SOLVE
  # box instead dumps oblique rays' opacity on its side walls.
  viewer_crop_xy_m: [[-5.0, 7.0], [-5.0, 5.0]]
  # Display-only initial viewer clip box (x, y, z; world metres): the ceiling
  # region over both positions. On the baseline grid it is clip fractions
  # x 0.32-0.68, y 0.31-0.67, z 0.54-0.90. No analysis reads it.
  viewer_clip_m: [[-2.29, 4.19], [-2.84, 3.20], [5.32, 8.20]]

reconstruction:
  algorithm: tv
  n_iter: 150
  # Swept 0.01-0.2 on the data: 0.03 is where chi2 ~ 1 under the bootstrap
  # weights, the least smoothing that stops fitting noise; 0.08+ smears beams.
  tv_alpha: 0.03
  # z smoothing fights the only depth information (parallax of sharp features).
  tv_z_weight: 0.0
  # Damps voxels crossed by one or two rays (the noise shell); 0.2+ over-damps.
  coverage_damping: 0.05

selfcal:
  free_pose: pos1
  baseline_m: null        # fit separation; absolute scale retains dependence on the floor-offset prior
  # With the separation fixed the bearing search is +-bounds_m/baseline_m rad
  # in fixed-baseline mode; in free mode bounds_m bounds x and y around the prior.
  bounds_m: 1.0           # original free-baseline search bounds around the floor-offset prior
  bounds_deg: 10.0
  spacing_m: 0.4          # coarse lattice for the pose objective
  n_iter: 60
  n_bootstrap: 8
  # With the separation fixed, the bearing is first scanned over its bounds in
  # these steps at the prior azimuth; Powell starts from the best one.
  scan_deg: 5.0

autofocus:
  z_min_m: 6.0
  z_max_m: 8.0
  coarse_m: 0.2
  fine_m: 0.1
  layer_thickness_m: 0.3
  spacing_m: 0.1          # 0.15 m aliases the ~1.7 m beam pitch at 7 m
  trim_pct: 90.0          # drop each view's worst 10% of bins (aliasing spikes)

beams:
  band_x: 0.32            # |tan_y| band averaged for profiles across x
  band_y: 0.45
  match_tol_m: 0.6
  prominence_sigmas: 0.5
  gate_max_offset_m: 0.15
  z_scan_m: [4.0, 9.0]
  n_z: 81
  min_y_corr: 0.5         # y features join the triangulation only if the y parallax agrees

beamdepth:
  model: geometry         # infer shadow geometry; opacity amplitudes remain nuisance parameters
  y_extent_m: [-5.0, 5.0]   # beams run along y across the room
  band_sy: 0.32
  w_init_m: 0.3
  h_init_m: 0.6
  # Common multistarts sample local depth minima without imposing a target.
  h_starts_m: [0.6, 1.2, 1.8]
  h_max_m: 3.0
  bg_degree: 2
  n_sub: 4
  y_band_m: [-2.0, 2.0]     # voxel z-profile cross-check: y range averaged

uncertainty:
  n_replicas: 50
  seed: 0
  flux_scale_frac: 0.03     # sky-run vs position-run flux difference (pressure, epoch)
  mcs_p_min_gev: 0.5        # conservative lower muon momentum cut for MCS (overburden unknown; higher only lowers it)

validation:
  focus_heights_m: [6.6, 7.0, 7.4]
  depth_h_true_m: [0.6, 1.25, 2.0]
  n_realizations: 8

# Material inputs for the optional concrete comparison and scattering model.
physics:
  concrete_density_gcm3: 2.4    # steel-reinforced concrete, nominal
  concrete_density_sigma: 0.1   # its systematic
  # ESTIMATE, not measured: kinetic energy to cross the four scintillator
  # planes and their housing, taken as ~6 g/cm^2 (CSDA range of a 30 MeV muon).
  detector_threshold_gev: 0.03
  # Guan et al. 2015 (arXiv:1509.06176): Gaisser's PDG formula corrected to
  # sub-GeV energies. PDG eq. (30.4) itself is valid only above 100/cos GeV.
  flux_model: guan
  flux_model_alt: shukla        # Shukla & Sankrith 2018 (arXiv:1606.06907)
